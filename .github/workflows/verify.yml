name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

permissions:
  # Render and build only; nothing here writes to the repository.
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  express-api:
    name: express-api (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { name: full, preset: full, test: true }
          - { name: minimal, preset: minimal, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./express-api --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --preset "${{ matrix.combo.preset }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run build
      - name: Test rendered output
        working-directory: ${{ runner.temp }}/out
        run: npm test

  fastify-api:
    name: fastify-api (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [full, minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./fastify-api --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --preset "${{ matrix.preset }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run build
          npm test

  nestjs:
    name: nestjs (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "" }
          - { name: minimal, args: "--preset minimal" }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./nestjs --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" ${{ matrix.args }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run build
          npm test
          npm run test:e2e

  # The commands AGENTS.md hands to an agent have to be the ones this form is
  # verified with. Drift here is silent: the wrong command just runs.
  agents:
    name: AGENTS.md matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/check-agents@main
